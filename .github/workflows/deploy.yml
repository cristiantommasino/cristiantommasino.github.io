# Builds the site and publishes it on GitHub Pages at every push to "main".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Commits made by the "Update data" workflow do not trigger "push", so redeploy after it runs.
  workflow_run:
    workflows: [Update data]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          # Works both for "<user>.github.io" repositories and for project repositories,
          # and for custom domains configured in Settings → Pages.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      # Regenerate the PDF CV from the current data (falls back to the committed PDF on failure).
      - run: node scripts/make-cv-pdf.mjs
        continue-on-error: true
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
