seo_description: Cristian Tommasino is an Assistant Professor at the University of Naples Federico II working on computational pathology, graph learning and vision-language models.

bio_short: >-
  Cristian Tommasino is an Assistant Professor (RTD-A) at the Department of Electrical Engineering and
  Information Technology (DIETI), University of Naples Federico II, and a member of the
  IKNOS Lab. He develops efficient deep-learning methods for computational pathology, from
  fast nuclei segmentation to cell-graph models for cancer subtyping, and connect them with
  knowledge graphs and vision-language models for retrieval and decision support.

# Paragraphs of the long bio (one item = one paragraph). Plain text; *text* becomes italic.
bio_long:
  - >-
    Cristian Tommasino is an Assistant Professor (RTD-A, sector IINF-05/A Information
    Processing Systems) at DIETI, University of Naples Federico II, since July 2024, where he
    works in the IKNOS Lab led by Prof. Antonio Maria Rinaldi and collaborates with the PICUS
    Lab (Pattern analysis and Intelligent Computation for mUltimedia Systems). He received his BSc and his MSc
    (110/110 cum laude) in Computer Engineering from the same university, with a master's
    thesis on multimedia web document retrieval based on text and visual descriptors. He then
    carried out his PhD in Information and Communication Technology for Health at Federico II,
    with the thesis *Distilled Nuclei Segmentation for Graph-Based Whole Slide Images Analysis
    and Retrieval*, and was a postdoctoral research fellow at the CIRMIS centre of the same
    university.
  - >-
    His research focuses on computational pathology: analysing whole-slide histology images at
    the level of individual cells, efficiently enough to be practical. During a visiting period
    at the Computational Pathology Group of Radboud University Medical Center (Nijmegen,
    2022–2023) he developed HoVer-UNet, which distils HoVerNet into a single U-Net and is about three times faster at
    inference; he later developed NuLite, a lightweight model for nuclei instance segmentation
    and classification. Both are open source. On top of these segmentations he builds cell
    graphs to classify breast cancer subtypes with graph neural networks, and, with
    pathologists at the University of Naples, he studies how to infer biomarkers directly from
    routine H&E slides.
  - >-
    More recently he has been working on vision-language models and on retrieval-augmented,
    agent-based systems for medicine, alongside a long-running line of work on multimedia
    knowledge graphs and information retrieval. He organises workshops on AI for biomedical
    data: he was Workshop Chair of AIBio at ECAI 2025, co-organised REHMED at ECML PKDD 2026,
    and is the primary contact of CVPath, the computational pathology workshop at WACV 2027.
    He was also Local Sponsors Chair of ECML PKDD 2026 in Naples and serves on the programme
    committees of several international conferences.
    He reviews for journals including *Medical Image Analysis*, and teaches Multimedia Systems
    and machine learning courses at Federico II.

