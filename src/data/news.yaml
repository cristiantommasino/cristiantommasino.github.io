- date: 2026-08-22
  tag: event
  text: '[CVPath](https://cvpath-vision4neuro.github.io/wacv2027/), the 1st workshop on Computer Vision for Computational and Digital Pathology, is coming to WACV 2027 (January 2027) together with Vision4Neuro, hosting the [OWL challenge](https://owl.grand-challenge.org/) on interpretable AI for prostate cancer recurrence.'

