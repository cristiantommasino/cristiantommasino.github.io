- title: CVPath @ WACV 2027 – Computer Vision for Computational and Digital Pathology
  kind: Workshop
  status: active
  period: 2026 – 2027
  description: >-
    First edition of CVPath, held with Vision4Neuro as the full-day workshop "Vision for
    Biomedical Discovery" at WACV 2027 (Lake Buena Vista, FL, USA, January 2027). Organised
    with Radboudumc, Human Technopole, the University of Molise and UNINA; it hosts the OWL
    challenge on interpretable AI for prostate cancer recurrence.
  links:
    - label: Website
      url: https://cvpath-vision4neuro.github.io/wacv2027/
    - label: OWL challenge
      url: https://owl.grand-challenge.org/

